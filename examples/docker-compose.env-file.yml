# Docker-compose example using external .env file for custom instructions
# This approach is recommended for large custom instruction sets

version: '3.8'

services:
  reviewbot-llm:
    build: .
    env_file:
      - custom_rules.env  # Load custom instructions from external file
    environment:
      # Backend selection
      - REVIEWBOT_LLM_BACKEND=openwebui
      
      # OpenWebUI configuration
      - REVIEWBOT_LLM_OPENWEBUI_URL=http://host.docker.internal:3000
      - REVIEWBOT_LLM_OPENWEBUI_API_KEY=${OPENWEBUI_API_KEY}  # From shell environment
      
      # llamacpp configuration
      - REVIEWBOT_LLM_LLAMACPP_URL=http://host.docker.internal:8080
      - REVIEWBOT_LLM_LLAMACPP_API_KEY=${LLAMACPP_API_KEY}  # From shell environment
      
      # Model configuration
      - REVIEWBOT_LLM_MODEL_NAME=llama2
      - REVIEWBOT_LLM_MAX_TOKENS=1000
      - REVIEWBOT_LLM_TEMPERATURE=0.1
      
      # Review Board configuration
      - REVIEWBOARD_URL=${REVIEWBOARD_URL}
      - REVIEWBOARD_USERNAME=${REVIEWBOARD_USERNAME}
      - REVIEWBOARD_PASSWORD=${REVIEWBOARD_PASSWORD}
      
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
