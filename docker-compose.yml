version: '3.8'

services:
  reviewbot-llm:
    build: .
    container_name: reviewbot-llm
    environment:
      # ReviewBot configuration
      - REVIEWBOT_BROKER_URL=redis://redis:6379/0
      - REVIEWBOT_RESULT_BACKEND=redis://redis:6379/0
      
      # LLM Extension configuration - connect to external services
      - REVIEWBOT_LLM_BACKEND=openwebui  # or 'llamacpp'
      - REVIEWBOT_LLM_OPENWEBUI_URL=http://host.docker.internal:3000
      - REVIEWBOT_LLM_OPENWEBUI_API_KEY=your_api_key_here
      - REVIEWBOT_LLM_LLAMACPP_URL=http://host.docker.internal:8080
      - REVIEWBOT_LLM_LLAMACPP_API_KEY=your_llamacpp_api_key_here
      - REVIEWBOT_LLM_MODEL_NAME=llama2
      - REVIEWBOT_LLM_MAX_TOKENS=1000
      - REVIEWBOT_LLM_TEMPERATURE=0.1
      - REVIEWBOT_LLM_CUSTOM_INSTRUCTIONS=Follow PEP 8 for Python code. Use meaningful variable names. Add docstrings to all functions.
    depends_on:
      - redis
    volumes:
      # Mount for local model files if using llamacpp
      - ./models:/app/models
    networks:
      - reviewbot-network
    # Allow access to host services (OpenWebUI/Ollama running separately)
    extra_hosts:
      - "host.docker.internal:host-gateway"

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - reviewbot-network

networks:
  reviewbot-network:
    driver: bridge

